name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number: build and publish an alpha prerelease from that PR head (leave empty to build the selected branch).'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-test-and-release:
    name: Build, test, and release
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      target-sha: ${{ steps.release.outputs.target-sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      store-version: ${{ steps.release.outputs.store-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # When a PR number is supplied, build that PR's head; otherwise the selected ref.
          ref: ${{ github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SonicRelay.Windows.slnx

      - name: Build solution
        run: dotnet build SonicRelay.Windows.slnx --configuration Release --no-restore

      - name: Run repository structure tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Repository.Structure.Tests.ps1

      - name: Run .NET tests
        run: >-
          dotnet test SonicRelay.Windows.slnx --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=sonicrelay-release"
          --results-directory TestResults

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $prNumber = '${{ github.event.inputs.pr_number }}'
          $runNumber = '${{ github.run_number }}'

          if ('${{ github.ref_type }}' -eq 'tag') {
            # Real, verified release from a v* tag.
            $tag = '${{ github.ref_name }}'
            $version = $tag.TrimStart('v')
            $prerelease = 'false'
          }
          elseif (-not [string]::IsNullOrWhiteSpace($prNumber)) {
            # Manual alpha build from a specific PR head.
            $tag = "v0.0.0-alpha.pr$prNumber.$runNumber"
            $version = "0.0.0-alpha.pr$prNumber.$runNumber"
            $prerelease = 'true'
          }
          else {
            # Manual build of the selected branch (also a prerelease).
            $tag = "v0.0.0-manual.$runNumber"
            $version = "0.0.0-manual.$runNumber"
            $prerelease = 'true'
          }

          $msiVersionBase = ($version -split '[+-]')[0]
          $versionParts = @($msiVersionBase.Split('.') | Where-Object { $_ -match '^\d+$' })
          while ($versionParts.Count -lt 3) {
            $versionParts += '0'
          }
          $msiVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"

          # The Store rejects package version 0.0.0.0, which is exactly what the alpha and
          # manual prerelease versions above collapse to. Borrow the run number so the Store
          # packaging job still builds a valid - and monotonically increasing - package.
          $storeVersion = $msiVersion
          if ($storeVersion -eq '0.0.0') {
            $storeVersion = "0.0.$([Math]::Max(1, [int]$runNumber % 65536))"
          }

          # The commit actually checked out (the PR head for an alpha build), used as the
          # release target so the tag points at exactly what was built.
          $targetSha = (git rev-parse HEAD).Trim()

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi-version=$msiVersion" >> $env:GITHUB_OUTPUT
          "store-version=$storeVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "target-sha=$targetSha" >> $env:GITHUB_OUTPUT
          "pr-number=$prNumber" >> $env:GITHUB_OUTPUT

      - name: Restore Windows x64 publish dependencies
        run: >-
          dotnet restore src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
          --runtime win-x64

      - name: Publish portable Windows x64 app
        run: >-
          dotnet publish src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true --no-restore
          --output artifacts/publish/win-x64

      - name: Install WiX toolset
        shell: pwsh
        run: |
          # Pin to WiX v5: v6+ requires accepting the Open Source Maintenance Fee EULA,
          # which fails an unattended CI install. v5 uses the same v4 authoring schema.
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          # Standard bootstrapper (bal:) lives in this package in v5.
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Create ZIP, EXE, MSI, and checksums
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $msiVersion = '${{ steps.release.outputs.msi-version }}'
          $publishDirectory = Join-Path $PWD 'artifacts/publish/win-x64'
          $distDirectory = Join-Path $PWD 'artifacts/release'

          New-Item -ItemType Directory -Force -Path $distDirectory | Out-Null

          $zipPath = Join-Path $distDirectory "SonicRelay.WindowsPublisher-win-x64-$version.zip"
          $exePath = Join-Path $distDirectory "SonicRelay.WindowsPublisher-win-x64-$version.exe"
          $msiPath = Join-Path $distDirectory "SonicRelay.WindowsPublisher-win-x64-$version.msi"
          $checksumsPath = Join-Path $distDirectory 'checksums-sha256.txt'

          @(
            "Version: $version"
            "Commit: ${{ github.sha }}"
            'Runtime: win-x64'
            "BuiltAtUtc: $((Get-Date).ToUniversalTime().ToString('O'))"
          ) | Set-Content -LiteralPath (Join-Path $publishDirectory 'BUILD-INFO.txt')

          Compress-Archive -Path "$publishDirectory/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          # 1) Per-user MSI (installs to %LOCALAPPDATA%\SonicRelay\WindowsPublisher).
          wix build packaging/SonicRelay.WindowsPublisher.wxs `
            -arch x64 `
            -d ProductVersion=$msiVersion `
            -d PublishDir=$publishDirectory `
            -o $msiPath

          # 2) Setup .exe = Burn bundle wrapping the MSI (NOT the raw app binary).
          #    Double-clicking it runs setup and installs per-user with no elevation.
          wix build packaging/SonicRelay.WindowsPublisher.Bundle.wxs `
            -arch x64 `
            -ext WixToolset.BootstrapperApplications.wixext `
            -d ProductVersion=$msiVersion `
            -d MsiPath=$msiPath `
            -o $exePath

          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Expected setup bundle was not produced: $exePath"
          }

          Get-ChildItem -Path $distDirectory -File |
            Where-Object { $_.Extension -in @('.zip', '.exe', '.msi') } |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -LiteralPath $checksumsPath -Encoding ASCII

          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "exe=$exePath" >> $env:GITHUB_OUTPUT
          "msi=$msiPath" >> $env:GITHUB_OUTPUT
          "checksums=$checksumsPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $targetSha = '${{ steps.release.outputs.target-sha }}'
          $prNumber = '${{ steps.release.outputs.pr-number }}'
          $isPrerelease = '${{ steps.release.outputs.prerelease }}' -eq 'true'

          if (-not [string]::IsNullOrWhiteSpace($prNumber)) {
            $title = "SonicRelay Windows Publisher $tag (alpha, PR #$prNumber)"
          } else {
            $title = "SonicRelay Windows Publisher $tag"
          }

          $extraArgs = @()
          if ('${{ github.ref_type }}' -eq 'tag') {
            # A pushed v* tag already exists; verify it points at this build.
            $extraArgs += '--verify-tag'
          } else {
            # Manual runs create the tag on the built commit (the PR head for an alpha build).
            $extraArgs += @('--target', $targetSha)
          }
          if ($isPrerelease) {
            $extraArgs += '--prerelease'
          }

          $extraArgs += @(
            '--generate-notes'
            '--notes'
            "Build version: $version`nCommit: $targetSha`nRuntime: win-x64"
          )

          $assets = @(
            '${{ steps.assets.outputs.zip }}'
            '${{ steps.assets.outputs.exe }}'
            '${{ steps.assets.outputs.msi }}'
            '${{ steps.assets.outputs.checksums }}'
          )

          # Retries transient GitHub API 5xx responses instead of failing a release whose
          # packages were all produced successfully.
          ./.github/scripts/Publish-GitHubRelease.ps1 `
            -Tag $tag `
            -Title $title `
            -Asset $assets `
            -ExtraArgument $extraArgs

  store-package:
    name: Package Microsoft Store MSIX
    # Runs only after the Windows job's build, tests and release succeeded, so a Store
    # artifact never exists for a commit that did not pass the release gate.
    needs: build-test-and-release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The identity reserved for SonicRelay in the Partner Center. Repository variables, not
      # secrets: the package identity is public, it is printed on the Store listing. With
      # these unset the packaging script falls back to the placeholder identity in
      # packaging/windows/msix/store-identity.json and warns, so the job still proves the
      # pipeline works before an account exists.
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same commit the Windows job just built and released.
          ref: ${{ needs.build-test-and-release.outputs.target-sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Windows x64 app for packaging
        run: >-
          dotnet publish src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output artifacts/publish/store-win-x64

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        run: |
          ./packaging/windows/Build-MsixPackage.ps1 `
            -PublishDirectory artifacts/publish/store-win-x64 `
            -Version '${{ needs.build-test-and-release.outputs.store-version }}' `
            -OutputDirectory artifacts/store

      # Kept as a workflow artifact too, so the package is available while the release
      # assets are still being attached; store-release-assets publishes it to the release.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: store-package-${{ needs.build-test-and-release.outputs.version }}
          path: artifacts/store/*
          if-no-files-found: error
          retention-days: 30

  linux-package:
    name: Package Linux release assets
    needs: build-test-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same commit the Windows job just built and released, so both platforms'
          # assets come from the identical tag/commit (issue #40 acceptance criteria).
          ref: ${{ needs.build-test-and-release.outputs.target-sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Linux x64 publish dependencies
        run: >-
          dotnet restore src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
          --runtime linux-x64

      - name: Publish self-contained Linux x64 app
        run: >-
          dotnet publish src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
          --configuration Release --runtime linux-x64 --self-contained true --no-restore
          --output artifacts/publish/linux-x64

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build tar.gz, deb, rpm, and AppImage packages
        run: >-
          packaging/linux/build-packages.sh
          artifacts/publish/linux-x64
          '${{ needs.build-test-and-release.outputs.version }}'
          '${{ needs.build-test-and-release.outputs.target-sha }}'
          artifacts/release

      - name: Extend the release's checksums and notes with the Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-test-and-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-test-and-release.outputs.version }}
        run: |
          set -euo pipefail
          distDir=artifacts/release

          # shellcheck source=.github/scripts/gh-retry.sh
          source .github/scripts/gh-retry.sh

          # Merge into the Windows job's checksums-sha256.txt so there is one canonical
          # checksums file per release, covering every platform's assets.
          retry_gh gh release download "$RELEASE_TAG" --pattern checksums-sha256.txt --dir "$distDir" --clobber
          ( cd "$distDir" && sha256sum SonicRelay-LinuxPublisher-*.tar.gz SonicRelay-LinuxPublisher-*.deb SonicRelay-LinuxPublisher-*.rpm SonicRelay-LinuxPublisher-*.AppImage >> checksums-sha256.txt )

          currentNotes=$(retry_gh gh release view "$RELEASE_TAG" --json body --jq .body)
          linuxNotes=$(printf '\n\n## Linux assets\n\n- `SonicRelay-LinuxPublisher-linux-x64-%s.tar.gz`: portable self-contained folder archive.\n- `SonicRelay-LinuxPublisher-linux-x64-%s.deb`: Debian/Ubuntu package (officially Ubuntu 24.04).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.rpm`: Fedora package (best effort).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.AppImage`: portable single-file app for any x64 glibc-based distribution.\n\nSee `docs/linux-publisher.md` for installation, dependencies, and known limitations.\n' "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION")

          retry_gh gh release edit "$RELEASE_TAG" --notes "${currentNotes}${linuxNotes}"

          retry_gh gh release upload "$RELEASE_TAG" \
            "$distDir"/SonicRelay-LinuxPublisher-*.tar.gz \
            "$distDir"/SonicRelay-LinuxPublisher-*.deb \
            "$distDir"/SonicRelay-LinuxPublisher-*.rpm \
            "$distDir"/SonicRelay-LinuxPublisher-*.AppImage \
            "$distDir/checksums-sha256.txt" \
            --clobber

  macos-package:
    name: Package macOS release assets
    # Depends on the Linux job as well as the Windows one it takes its version
    # outputs from: both extend the same release notes and the same canonical
    # checksums-sha256.txt, so they must run one after the other or the later
    # read-modify-write would clobber the earlier job's additions.
    needs: [build-test-and-release, linux-package]
    # A macOS runner is required for the platform-specific steps (swiftc for the
    # ScreenCaptureKit helper, iconutil, codesign, notarytool, hdiutil), so a macOS
    # release is produced without any contributor owning a Mac (issue #62).
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Signing and notarization are opt-in: with these unset the same bundles are
      # still produced, just unsigned.
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same commit the Windows job just built and released, so every platform's
          # assets come from the identical tag/commit.
          ref: ${{ needs.build-test-and-release.outputs.target-sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Import Developer ID signing certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: .github/scripts/import-macos-certificate.sh

      - name: Publish and package osx-arm64 and osx-x64 app bundles
        run: |
          set -euo pipefail
          for runtimeId in osx-arm64 osx-x64; do
            dotnet publish src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj \
              --configuration Release --runtime "$runtimeId" --self-contained true \
              --output "artifacts/publish/$runtimeId"

            packaging/macos/build-app-bundle.sh \
              "artifacts/publish/$runtimeId" \
              "$runtimeId" \
              '${{ needs.build-test-and-release.outputs.version }}' \
              '${{ needs.build-test-and-release.outputs.target-sha }}' \
              artifacts/release
          done

      - name: Extend the release's checksums and notes with the macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-test-and-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-test-and-release.outputs.version }}
        run: .github/scripts/publish-macos-assets.sh

  store-release-assets:
    name: Attach the Microsoft Store MSIX to the release
    # The Store package itself is built in parallel by store-package; only the attachment
    # waits, and it waits on macos-package because linux-package, macos-package and this job
    # all read-modify-write the same release notes and the same canonical
    # checksums-sha256.txt, so they must run one after the other.
    needs: [build-test-and-release, store-package, macos-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same commit the Windows job just built and released.
          ref: ${{ needs.build-test-and-release.outputs.target-sha }}

      - name: Download the Microsoft Store package
        uses: actions/download-artifact@v4
        with:
          name: store-package-${{ needs.build-test-and-release.outputs.version }}
          path: artifacts/store

      - name: Extend the release's checksums and notes with the Store package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-test-and-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-test-and-release.outputs.version }}
          STORE_VERSION: ${{ needs.build-test-and-release.outputs.store-version }}
        run: .github/scripts/publish-store-assets.sh
