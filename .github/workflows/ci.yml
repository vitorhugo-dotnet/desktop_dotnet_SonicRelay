name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release version, for example 0.1.0. Empty uses 0.0.0.<build number>.'
        required: false
        type: string

# Release publishing needs contents:write only in the packaging job.
permissions:
  contents: read

env:
  SOLUTION_PATH: SonicRelay.Windows.slnx
  APP_PROJECT_PATH: src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
  CONFIGURATION: Release
  RUNTIME_ID: win-x64
  MACOS_RUNTIME_ID: osx-arm64
  APP_EXE_NAME: SonicRelay.Windows.Desktop.exe
  PRODUCT_NAME: SonicRelay.WindowsPublisher

jobs:
  build-and-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SonicRelay.Windows.slnx

      - name: Build solution
        run: dotnet build SonicRelay.Windows.slnx --configuration Release --no-restore

      - name: Run repository structure tests
        shell: pwsh
        run: ./tests/Repository.Structure.Tests.ps1

      - name: Run release publishing helper tests
        shell: pwsh
        run: ./tests/Publish-GitHubRelease.Tests.ps1

      - name: Run Microsoft Store packaging tests
        shell: pwsh
        run: ./tests/Build-MsixPackage.Tests.ps1

      - name: Run gh retry helper tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: ./tests/gh-retry.Tests.sh

      - name: Run .NET tests
        run: >-
          dotnet test SonicRelay.Windows.slnx --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=sonicrelay"
          --results-directory TestResults

      # The Desktop.Tests project already boots the real Avalonia App/MainWindow through the
      # headless Skia backend (ShellRenderTests), so `dotnet test` above already covers layout
      # smoke coverage on Linux. This step additionally launches the actual published Linux
      # binary under a virtual display to prove the real entry point (Program.Main ->
      # DesktopRuntimeFactory -> Linux composition) starts and stays up without a live PipeWire
      # session, Secret Service, or backend available, matching the design spec's Linux startup
      # smoke test requirement.
      - name: Install Linux desktop smoke-test dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Avalonia Linux startup smoke test
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          publishDir="$RUNNER_TEMP/smoke-publish"
          dotnet publish "$APP_PROJECT_PATH" \
            --configuration "$CONFIGURATION" \
            --runtime linux-x64 \
            --self-contained true \
            -o "$publishDir"

          chmod +x "$publishDir/SonicRelay.Windows.Desktop"

          xvfb-run --auto-servernum "$publishDir/SonicRelay.Windows.Desktop" &
          appPid=$!

          sleep 8

          if ! kill -0 "$appPid" 2>/dev/null; then
            echo "::error::SonicRelay.Windows.Desktop exited before the smoke-test window elapsed"
            exit 1
          fi

          kill "$appPid"
          wait "$appPid" 2>/dev/null || true

      # The macOS equivalent of the Linux xvfb smoke test above (issue #62). It builds
      # the real SonicRelay.app — which compiles the native ScreenCaptureKit helper with
      # swiftc and generates the icon set and Info.plist — and then launches the bundled
      # binary, so a PR that breaks either the macOS packaging path or macOS startup
      # fails here rather than at release time. Launching does not trigger the Screen
      # Recording prompt: the helper is only started when the user starts capture.
      - name: Avalonia macOS startup smoke test
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          publishDir="$RUNNER_TEMP/macos-smoke-publish"
          bundleDir="$RUNNER_TEMP/macos-smoke-bundle"

          dotnet publish "$APP_PROJECT_PATH" \
            --configuration "$CONFIGURATION" \
            --runtime "$MACOS_RUNTIME_ID" \
            --self-contained true \
            -o "$publishDir"

          packaging/macos/build-app-bundle.sh \
            "$publishDir" "$MACOS_RUNTIME_ID" "0.0.0-smoke" "$GITHUB_SHA" "$bundleDir"

          # Launch the app out of the published .zip rather than from a build
          # directory: the bundle itself is assembled in a temporary staging
          # directory that build-app-bundle.sh removes on exit, and the .zip is
          # what users actually download — so this also proves ditto round-trips
          # the bundle intact.
          extractDir="$RUNNER_TEMP/macos-smoke-app"
          rm -rf "$extractDir"
          mkdir -p "$extractDir"
          ditto -x -k "$bundleDir"/SonicRelay-MacPublisher-*.zip "$extractDir"

          appDir="$extractDir/SonicRelay.app"
          appBinary="$appDir/Contents/MacOS/SonicRelay.Windows.Desktop"
          test -x "$appDir/Contents/MacOS/sonicrelay-audio-tap"
          test -f "$appDir/Contents/Info.plist"
          test -f "$appDir/Contents/Resources/SonicRelay.icns"

          "$appBinary" &
          appPid=$!

          sleep 10

          if ! kill -0 "$appPid" 2>/dev/null; then
            echo "::error::SonicRelay.app exited before the smoke-test window elapsed"
            exit 1
          fi

          kill "$appPid"
          wait "$appPid" 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  package-release:
    name: Package release assets
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      display_version: ${{ steps.metadata.outputs.display_version }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package metadata
        id: metadata
        shell: pwsh
        run: |
          $manualVersion = '${{ github.event.inputs.release_version }}'
          $runNumber = '${{ github.run_number }}'

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagName = '${{ github.ref_name }}'
          }
          elseif (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
            $tagName = if ($manualVersion.StartsWith('v')) { $manualVersion } else { "v$manualVersion" }
          }
          else {
            # Keep the CI build number as the fourth component. It is build/revision
            # metadata for this desktop product, not a semantic-version patch number.
            $buildVersion = "0.0.0.$runNumber"
            $tagName = "v$buildVersion"
          }

          $displayVersion = if ($tagName.StartsWith('v')) { $tagName.Substring(1) } else { $tagName }
          $assetVersion = $displayVersion -replace '[^0-9A-Za-z.-]', '-'
          $msiVersionBase = ($displayVersion -split '[+-]')[0]
          $versionParts = @($msiVersionBase.Split('.') | Where-Object { $_ -match '^\d+$' })

          while ($versionParts.Count -lt 3) {
            $versionParts += '0'
          }

          $msiVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"
          $isPrerelease = if ($displayVersion -match '-' -or -not $tagName.StartsWith('v')) { 'true' } else { 'false' }

          # MSI ProductVersion supports only three components. Preserve the four-component
          # public build version in the release/tag while mapping the CI build to MSI's
          # third component, which must also be non-zero.
          if ($displayVersion -eq "0.0.0.$runNumber") {
            $msiVersion = "0.0.$([Math]::Max(1, [int]$runNumber % 65536))"
          }

          # The Store rejects package version 0.0.0.0. Borrow the run number so the MSIX step
          # still builds a valid package for a version that would collapse to zeros.
          $storeVersion = $msiVersion
          if ($storeVersion -eq '0.0.0') {
            $storeVersion = "0.0.$([Math]::Max(1, [int]$runNumber % 65536))"
          }

          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "display_version=$displayVersion" >> $env:GITHUB_OUTPUT
          "asset_version=$assetVersion" >> $env:GITHUB_OUTPUT
          "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          "store_version=$storeVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore $env:APP_PROJECT_PATH --runtime $env:RUNTIME_ID

      - name: Publish portable folder
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable'

          dotnet publish $env:APP_PROJECT_PATH `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:DebugType=embedded `
            -o $publishDir

          @"
          product=SonicRelay Desktop
          version=${{ steps.metadata.outputs.display_version }}
          commit=${{ github.sha }}
          runtime=$env:RUNTIME_ID
          configuration=$env:CONFIGURATION
          builtAtUtc=$((Get-Date).ToUniversalTime().ToString('O'))
          "@ | Set-Content -Path (Join-Path $publishDir 'BUILD-INFO.txt') -Encoding UTF8

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          $singleFileDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/single-file'

          # Portable EXE asset. It stays per-user and does not create services, drivers, firewall rules, or admin-only writes.
          dotnet publish $env:APP_PROJECT_PATH `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o $singleFileDir

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version

      - name: Build ZIP, EXE, and MSI packages
        shell: pwsh
        run: |
          $assetVersion = '${{ steps.metadata.outputs.asset_version }}'
          $msiVersion = '${{ steps.metadata.outputs.msi_version }}'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $portableDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable'
          $singleFileDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/single-file'

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $zipPath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.zip"
          $exePath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.exe"
          $msiPath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.msi"

          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $zipPath -Force

          $publishedExe = Join-Path $singleFileDir $env:APP_EXE_NAME
          if (-not (Test-Path $publishedExe)) {
            throw "Expected published EXE was not found: $publishedExe"
          }
          Copy-Item -Path $publishedExe -Destination $exePath -Force

          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build packaging/SonicRelay.WindowsPublisher.wxs `
            -arch x64 `
            -d ProductVersion=$msiVersion `
            -d PublishDir=$portableDir `
            -o $msiPath

          Get-ChildItem -Path $distDir -File |
            Where-Object { $_.Extension -in @('.zip', '.exe', '.msi') } |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -Path (Join-Path $distDir 'checksums-sha256.txt') -Encoding ASCII

          @"
          # SonicRelay Desktop ${{ steps.metadata.outputs.display_version }}

          Built from ``${{ github.sha }}`` for ``$env:RUNTIME_ID``.

          Assets:
          - ``$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.zip``: portable folder distribution.
          - ``$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.exe``: portable single-file executable.
          - ``$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.msi``: per-user MSI installer.

          Notes:
          - The MSI installs under the current user's LocalAppData path and is intentionally per-user.
          - None of the packages should require administrator privileges for normal app usage.
          - Packages are currently unsigned.
          "@ | Set-Content -Path (Join-Path $distDir 'RELEASE-NOTES.md') -Encoding UTF8

      # The Microsoft Store package (issue #66). Built here as well as in release.yml so a
      # change that breaks Store packaging fails on the next push to main rather than at
      # submission time. See docs/microsoft-store-package.md.
      - name: Build Microsoft Store MSIX package
        shell: pwsh
        env:
          # Repository variables, not secrets: the package identity is public. All four map to
          # a manifest field the Store matches character for character; see
          # docs/microsoft-store-package.md.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $arguments = @{
            PublishDirectory = (Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable')
            Version = '${{ steps.metadata.outputs.store_version }}'
            OutputDirectory = (Join-Path $env:GITHUB_WORKSPACE 'artifacts/store')
          }

          # This workflow never runs on a v* tag, so it never produces a package for
          # submission - release.yml does, and it fails outright when an identity variable is
          # missing. Here a missing variable only downgrades the build to the placeholder
          # identity, and says so, so the packaging pipeline stays verifiable. With all four
          # set the build is strict: a blank or renamed variable fails on main rather than
          # producing a package Partner Center would reject.
          $required = @('MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME', 'MSIX_DISPLAY_NAME')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::Missing Microsoft Store identity repository variable(s): $($missing -join ', '). This package uses the placeholder identity in packaging/windows/msix/store-identity.json and cannot be submitted to Partner Center."
            $arguments.AllowPlaceholderIdentity = $true
          }

          ./packaging/windows/Build-MsixPackage.ps1 @arguments

      # The MSIX ships on the release as well: it is the artifact a Partner Center submission
      # is made from, and a workflow artifact expires. It stays unsigned - the Store re-signs
      # what it ingests and rejects anything signed by someone else - so the notes say what it
      # is and is not good for.
      - name: Add the Store package to the release checksums and notes
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $storeDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/store'
          $storeVersion = '${{ steps.metadata.outputs.store_version }}'

          $storePackages = @(
            Get-ChildItem -Path $storeDir -File |
              Where-Object { $_.Extension -in @('.msix', '.msixupload') } |
              Sort-Object -Property Name
          )

          if ($storePackages.Count -eq 0) {
            throw "No .msix or .msixupload package was produced in $storeDir."
          }

          $storePackages | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Add-Content -LiteralPath (Join-Path $distDir 'checksums-sha256.txt') -Encoding ASCII

          $lines = @('', '## Microsoft Store package', '')
          foreach ($package in $storePackages) {
            if ($package.Extension -eq '.msixupload') {
              $lines += "- ``$($package.Name)``: what the Partner Center Packages page expects (the ``.msix`` plus its ``.appxsym`` symbols)."
            } else {
              $lines += "- ``$($package.Name)``: the x64 Store package itself."
            }
          }

          $lines += @(
            ''
            'Both are unsigned on purpose: the Microsoft Store re-signs every package it ingests and rejects one signed by anybody else, so Windows refuses to install this `.msix` by double-clicking it. Install from the `.msi` or `.exe` above, or from the Store once the submission is live.'
            ''
            "Package version ``$storeVersion`` follows the Store's ``Major.Minor.Build.0`` rule, so it can differ from the release version above. See ``docs/microsoft-store-package.md``."
          )

          $lines | Add-Content -LiteralPath (Join-Path $distDir 'RELEASE-NOTES.md') -Encoding UTF8

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets-${{ steps.metadata.outputs.asset_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      # Kept as a workflow artifact too, alongside the copy the release step attaches to the
      # GitHub Release, so a build that never publishes a release (a pull request) still
      # produces a downloadable Store package.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: store-package-${{ steps.metadata.outputs.asset_version }}
          path: artifacts/store/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = '${{ steps.metadata.outputs.tag_name }}'
          $releaseTitle = 'SonicRelay Desktop ${{ steps.metadata.outputs.display_version }}'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/RELEASE-NOTES.md'
          $assetPaths = @(
            Get-ChildItem -Path 'artifacts/release' -File |
              Where-Object { $_.Extension -in @('.zip', '.exe', '.msi', '.txt') } |
              Select-Object -ExpandProperty FullName

            # The Store package: unsigned and not an installer, but the artifact a Partner
            # Center submission is made from, so it belongs on the release too.
            Get-ChildItem -Path 'artifacts/store' -File |
              Where-Object { $_.Extension -in @('.msix', '.msixupload') } |
              Select-Object -ExpandProperty FullName
          )

          $extraArguments = @('--target', '${{ github.sha }}', '--notes-file', $notesPath)

          if ('${{ steps.metadata.outputs.is_prerelease }}' -eq 'true') {
            $extraArguments += '--prerelease'
          }
          else {
            $extraArguments += '--latest'
          }

          # Retries transient GitHub API 5xx responses instead of failing a build whose
          # packages were all produced successfully.
          ./.github/scripts/Publish-GitHubRelease.ps1 `
            -Tag $tagName `
            -Title $releaseTitle `
            -Asset $assetPaths `
            -ExtraArgument $extraArguments

  package-release-linux:
    name: Package Linux release assets
    needs: package-release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove legacy dev releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # shellcheck source=.github/scripts/gh-retry.sh
          source .github/scripts/gh-retry.sh

          retry_gh gh release list --limit 1000 --json tagName --jq \
            '.[] | select(.tagName | startswith("dev-")) | .tagName' |
            while IFS= read -r legacyTag; do
              test -n "$legacyTag" || continue
              retry_gh gh release delete "$legacyTag" --cleanup-tag --yes
            done

          # Remove any dev-* tag that did not have a corresponding GitHub Release.
          retry_gh gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/dev-" \
            --jq '.[].ref' |
            while IFS= read -r legacyRef; do
              test -n "$legacyRef" || continue
              retry_gh gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/$legacyRef"
            done

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Linux x64 publish dependencies
        run: dotnet restore $APP_PROJECT_PATH --runtime linux-x64

      - name: Publish self-contained Linux x64 app
        run: >-
          dotnet publish $APP_PROJECT_PATH
          --configuration $CONFIGURATION --runtime linux-x64 --self-contained true --no-restore
          --output artifacts/publish/linux-x64

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build tar.gz, deb, rpm, and AppImage packages
        run: >-
          packaging/linux/build-packages.sh
          artifacts/publish/linux-x64
          '${{ needs.package-release.outputs.display_version }}'
          '${{ github.sha }}'
          artifacts/release

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets-${{ needs.package-release.outputs.asset_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Extend the release's checksums and notes with the Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.package-release.outputs.display_version }}
        run: |
          set -euo pipefail
          distDir=artifacts/release

          # shellcheck source=.github/scripts/gh-retry.sh
          source .github/scripts/gh-retry.sh

          # Merge into the Windows job's checksums-sha256.txt so there is one canonical
          # checksums file per release, covering every platform's assets.
          retry_gh gh release download "$RELEASE_TAG" --pattern checksums-sha256.txt --dir "$distDir" --clobber
          ( cd "$distDir" && sha256sum SonicRelay-LinuxPublisher-*.tar.gz SonicRelay-LinuxPublisher-*.deb SonicRelay-LinuxPublisher-*.rpm SonicRelay-LinuxPublisher-*.AppImage >> checksums-sha256.txt )

          currentNotes=$(retry_gh gh release view "$RELEASE_TAG" --json body --jq .body)
          linuxNotes=$(printf '\n\n## Linux assets\n\n- `SonicRelay-LinuxPublisher-linux-x64-%s.tar.gz`: portable self-contained folder archive.\n- `SonicRelay-LinuxPublisher-linux-x64-%s.deb`: Debian/Ubuntu package (officially Ubuntu 24.04).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.rpm`: Fedora package (best effort).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.AppImage`: portable single-file app for any x64 glibc-based distribution.\n\nSee `docs/linux-publisher.md` for installation, dependencies, and known limitations.\n' "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION")

          retry_gh gh release edit "$RELEASE_TAG" --notes "${currentNotes}${linuxNotes}"

          retry_gh gh release upload "$RELEASE_TAG" \
            "$distDir"/SonicRelay-LinuxPublisher-*.tar.gz \
            "$distDir"/SonicRelay-LinuxPublisher-*.deb \
            "$distDir"/SonicRelay-LinuxPublisher-*.rpm \
            "$distDir"/SonicRelay-LinuxPublisher-*.AppImage \
            "$distDir/checksums-sha256.txt" \
            --clobber

  package-release-macos:
    name: Package macOS release assets
    # Depends on the Linux job as well as the Windows one it takes its version
    # outputs from: both extend the same release notes and the same canonical
    # checksums-sha256.txt, so they must run one after the other or the later
    # read-modify-write would clobber the earlier job's additions.
    needs: [package-release, package-release-linux]
    if: github.event_name != 'pull_request'
    # A macOS runner is required for the platform-specific steps (swiftc for the
    # ScreenCaptureKit helper, iconutil, codesign, notarytool, hdiutil) — which is
    # the whole point of issue #62's CI requirement: no contributor needs to own a
    # Mac for a macOS release to be produced.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Signing and notarization are opt-in: when these are unset (pull requests
      # from forks, or a repository with no Apple Developer account configured)
      # the same bundles are still produced, just unsigned.
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Import Developer ID signing certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: .github/scripts/import-macos-certificate.sh

      - name: Publish and package osx-arm64 and osx-x64 app bundles
        run: |
          set -euo pipefail
          for runtimeId in osx-arm64 osx-x64; do
            dotnet publish "$APP_PROJECT_PATH" \
              --configuration "$CONFIGURATION" --runtime "$runtimeId" --self-contained true \
              --output "artifacts/publish/$runtimeId"

            packaging/macos/build-app-bundle.sh \
              "artifacts/publish/$runtimeId" \
              "$runtimeId" \
              '${{ needs.package-release.outputs.display_version }}' \
              '${{ github.sha }}' \
              artifacts/release
          done

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets-${{ needs.package-release.outputs.asset_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Extend the release's checksums and notes with the macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.package-release.outputs.display_version }}
        run: .github/scripts/publish-macos-assets.sh
