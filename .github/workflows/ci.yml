name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release version, for example 0.1.0. Empty creates a dev release.'
        required: false
        type: string

# Release publishing needs contents:write only in the packaging job.
permissions:
  contents: read

env:
  SOLUTION_PATH: SonicRelay.Windows.slnx
  APP_PROJECT_PATH: src/SonicRelay.Windows.Desktop/SonicRelay.Windows.Desktop.csproj
  CONFIGURATION: Release
  RUNTIME_ID: win-x64
  APP_EXE_NAME: SonicRelay.Windows.Desktop.exe
  PRODUCT_NAME: SonicRelay.WindowsPublisher

jobs:
  build-and-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SonicRelay.Windows.slnx

      - name: Build solution
        run: dotnet build SonicRelay.Windows.slnx --configuration Release --no-restore

      - name: Run repository structure tests
        shell: pwsh
        run: ./tests/Repository.Structure.Tests.ps1

      - name: Run .NET tests
        run: >-
          dotnet test SonicRelay.Windows.slnx --configuration Release --no-build --no-restore
          --logger "trx;LogFilePrefix=sonicrelay"
          --results-directory TestResults

      # The Desktop.Tests project already boots the real Avalonia App/MainWindow through the
      # headless Skia backend (ShellRenderTests), so `dotnet test` above already covers layout
      # smoke coverage on Linux. This step additionally launches the actual published Linux
      # binary under a virtual display to prove the real entry point (Program.Main ->
      # DesktopRuntimeFactory -> Linux composition) starts and stays up without a live PipeWire
      # session, Secret Service, or backend available, matching the design spec's Linux startup
      # smoke test requirement.
      - name: Install Linux desktop smoke-test dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Avalonia Linux startup smoke test
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          publishDir="$RUNNER_TEMP/smoke-publish"
          dotnet publish "$APP_PROJECT_PATH" \
            --configuration "$CONFIGURATION" \
            --runtime linux-x64 \
            --self-contained true \
            -o "$publishDir"

          chmod +x "$publishDir/SonicRelay.Windows.Desktop"

          xvfb-run --auto-servernum "$publishDir/SonicRelay.Windows.Desktop" &
          appPid=$!

          sleep 8

          if ! kill -0 "$appPid" 2>/dev/null; then
            echo "::error::SonicRelay.Windows.Desktop exited before the smoke-test window elapsed"
            exit 1
          fi

          kill "$appPid"
          wait "$appPid" 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  package-release:
    name: Package release assets
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      display_version: ${{ steps.metadata.outputs.display_version }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package metadata
        id: metadata
        shell: pwsh
        run: |
          $manualVersion = '${{ github.event.inputs.release_version }}'
          $runNumber = '${{ github.run_number }}'

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagName = '${{ github.ref_name }}'
          }
          elseif (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
            $tagName = if ($manualVersion.StartsWith('v')) { $manualVersion } else { "v$manualVersion" }
          }
          else {
            $tagName = "dev-$runNumber"
          }

          $displayVersion = if ($tagName.StartsWith('v')) { $tagName.Substring(1) } else { "0.0.$runNumber" }
          $assetVersion = $displayVersion -replace '[^0-9A-Za-z.-]', '-'
          $msiVersionBase = ($displayVersion -split '[+-]')[0]
          $versionParts = @($msiVersionBase.Split('.') | Where-Object { $_ -match '^\d+$' })

          while ($versionParts.Count -lt 3) {
            $versionParts += '0'
          }

          $msiVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"
          $isPrerelease = if ($displayVersion -match '-' -or -not $tagName.StartsWith('v')) { 'true' } else { 'false' }

          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "display_version=$displayVersion" >> $env:GITHUB_OUTPUT
          "asset_version=$assetVersion" >> $env:GITHUB_OUTPUT
          "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore $env:APP_PROJECT_PATH --runtime $env:RUNTIME_ID

      - name: Publish portable folder
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable'

          dotnet publish $env:APP_PROJECT_PATH `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:DebugType=embedded `
            -o $publishDir

          @"
          product=SonicRelay Windows Publisher
          version=${{ steps.metadata.outputs.display_version }}
          commit=${{ github.sha }}
          runtime=$env:RUNTIME_ID
          configuration=$env:CONFIGURATION
          builtAtUtc=$((Get-Date).ToUniversalTime().ToString('O'))
          "@ | Set-Content -Path (Join-Path $publishDir 'BUILD-INFO.txt') -Encoding UTF8

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          $singleFileDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/single-file'

          # Portable EXE asset. It stays per-user and does not create services, drivers, firewall rules, or admin-only writes.
          dotnet publish $env:APP_PROJECT_PATH `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o $singleFileDir

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.*
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version

      - name: Build ZIP, EXE, and MSI packages
        shell: pwsh
        run: |
          $assetVersion = '${{ steps.metadata.outputs.asset_version }}'
          $msiVersion = '${{ steps.metadata.outputs.msi_version }}'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $portableDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable'
          $singleFileDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/single-file'

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $zipPath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.zip"
          $exePath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.exe"
          $msiPath = Join-Path $distDir "$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.msi"

          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $zipPath -Force

          $publishedExe = Join-Path $singleFileDir $env:APP_EXE_NAME
          if (-not (Test-Path $publishedExe)) {
            throw "Expected published EXE was not found: $publishedExe"
          }
          Copy-Item -Path $publishedExe -Destination $exePath -Force

          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build packaging/SonicRelay.WindowsPublisher.wxs `
            -arch x64 `
            -d ProductVersion=$msiVersion `
            -d PublishDir=$portableDir `
            -o $msiPath

          Get-ChildItem -Path $distDir -File |
            Where-Object { $_.Extension -in @('.zip', '.exe', '.msi') } |
            ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -Path (Join-Path $distDir 'checksums-sha256.txt') -Encoding ASCII

          @"
          # SonicRelay Windows Publisher ${{ steps.metadata.outputs.display_version }}

          Built from `${{ github.sha }}` for `$env:RUNTIME_ID`.

          Assets:
          - `$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.zip`: portable folder distribution.
          - `$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.exe`: portable single-file executable.
          - `$env:PRODUCT_NAME-$env:RUNTIME_ID-$assetVersion.msi`: per-user MSI installer.

          Notes:
          - The MSI installs under the current user's LocalAppData path and is intentionally per-user.
          - None of the packages should require administrator privileges for normal app usage.
          - Packages are currently unsigned.
          "@ | Set-Content -Path (Join-Path $distDir 'RELEASE-NOTES.md') -Encoding UTF8

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets-${{ steps.metadata.outputs.asset_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = '${{ steps.metadata.outputs.tag_name }}'
          $releaseTitle = 'SonicRelay Windows Publisher ${{ steps.metadata.outputs.display_version }}'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/RELEASE-NOTES.md'
          $assetPaths = Get-ChildItem -Path 'artifacts/release' -File |
            Where-Object { $_.Extension -in @('.zip', '.exe', '.msi', '.txt') } |
            Select-Object -ExpandProperty FullName

          $args = @('release', 'create', $tagName)
          $args += $assetPaths
          $args += @('--target', '${{ github.sha }}', '--title', $releaseTitle, '--notes-file', $notesPath)

          if ('${{ steps.metadata.outputs.is_prerelease }}' -eq 'true') {
            $args += '--prerelease'
          }

          gh @args

  package-release-linux:
    name: Package Linux release assets
    needs: package-release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Linux x64 publish dependencies
        run: dotnet restore $APP_PROJECT_PATH --runtime linux-x64

      - name: Publish self-contained Linux x64 app
        run: >-
          dotnet publish $APP_PROJECT_PATH
          --configuration $CONFIGURATION --runtime linux-x64 --self-contained true --no-restore
          --output artifacts/publish/linux-x64

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build tar.gz, deb, rpm, and AppImage packages
        run: >-
          packaging/linux/build-packages.sh
          artifacts/publish/linux-x64
          '${{ needs.package-release.outputs.display_version }}'
          '${{ github.sha }}'
          artifacts/release

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets-${{ needs.package-release.outputs.asset_version }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Extend the release's checksums and notes with the Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.package-release.outputs.display_version }}
        run: |
          set -euo pipefail
          distDir=artifacts/release

          # Merge into the Windows job's checksums-sha256.txt so there is one canonical
          # checksums file per release, covering every platform's assets.
          gh release download "$RELEASE_TAG" --pattern checksums-sha256.txt --dir "$distDir" --clobber
          ( cd "$distDir" && sha256sum SonicRelay-LinuxPublisher-*.tar.gz SonicRelay-LinuxPublisher-*.deb SonicRelay-LinuxPublisher-*.rpm SonicRelay-LinuxPublisher-*.AppImage >> checksums-sha256.txt )

          currentNotes=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          linuxNotes=$(printf '\n\n## Linux assets\n\n- `SonicRelay-LinuxPublisher-linux-x64-%s.tar.gz`: portable self-contained folder archive.\n- `SonicRelay-LinuxPublisher-linux-x64-%s.deb`: Debian/Ubuntu package (officially Ubuntu 24.04).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.rpm`: Fedora package (best effort).\n- `SonicRelay-LinuxPublisher-linux-x64-%s.AppImage`: portable single-file app for any x64 glibc-based distribution.\n\nSee `docs/linux-publisher.md` for installation, dependencies, and known limitations.\n' "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION")

          gh release edit "$RELEASE_TAG" --notes "${currentNotes}${linuxNotes}"

          gh release upload "$RELEASE_TAG" \
            "$distDir"/SonicRelay-LinuxPublisher-*.tar.gz \
            "$distDir"/SonicRelay-LinuxPublisher-*.deb \
            "$distDir"/SonicRelay-LinuxPublisher-*.rpm \
            "$distDir"/SonicRelay-LinuxPublisher-*.AppImage \
            "$distDir/checksums-sha256.txt" \
            --clobber
